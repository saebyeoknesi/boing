<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>boing</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 10px 12px; width: 300px;
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  h1 span { font-weight: 400; opacity: .55; margin-left: 6px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 1fr 16px 1fr 22px; align-items: center; gap: 4px; }
  .row .arrow { text-align: center; opacity: .5; }
  input {
    min-width: 0; padding: 5px 7px; font: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    border-radius: 7px; background: Field; color: FieldText;
  }
  input:focus { outline: 2px solid #4a9eff; outline-offset: -1px; }
  button {
    font: inherit; border: 0; background: none; color: inherit; cursor: pointer;
    border-radius: 6px; padding: 3px 5px; opacity: .55;
  }
  button:hover { opacity: 1; background: color-mix(in srgb, CanvasText 8%, transparent); }
  .foot { display: flex; justify-content: space-between; margin-top: 8px; }
  .foot button { opacity: .8; padding: 4px 8px; }
</style>
<body>
  <h1>boing <span>this text → that text</span></h1>
  <div class="rows" id="rows"></div>
  <div class="foot">
    <button id="add">+ Add</button>
    <button id="reset">Reset</button>
  </div>
  <script src="boing.js"></script>
  <script src="popup.js"></script>
</body>
</html>
